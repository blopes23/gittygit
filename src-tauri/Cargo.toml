[package]
name = "gittygit"
version = "0.2.0"
description = "A fast, lightweight Git client for macOS"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
