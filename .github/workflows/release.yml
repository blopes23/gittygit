name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build a universal
# macOS app, sign the update archive and publish a GitHub release with latest.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history for the release notes

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Release notes from commits since the previous published release
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Previous *published* release, so tags whose build failed don't swallow their changes.
          prev=$(gh release list --exclude-drafts --limit 50 --json tagName --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          {
            echo 'body<<NOTES_EOF'
            git log --no-merges --format='%x1e%s%x1f%b' "${prev:+$prev..}${GITHUB_REF_NAME}" | node scripts/release-notes.mjs
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # A stable signing certificate keeps the app's identity the same across updates, so
      # macOS remembers folder-access permissions instead of asking again after each update.
      # The certificate is self-signed, so it is imported here and only its name is passed on:
      # given APPLE_CERTIFICATE, Tauri would look it up among *trusted* identities and fail.
      - name: Import code-signing certificate (if configured)
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::warning::No signing certificate secrets; building ad-hoc signed (macOS will re-ask for folder access after updates)."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 24)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$KC" | grep -q "\"$IDENTITY\"" || { echo "::error::Identity '$IDENTITY' not found in the imported certificate"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # With an Apple Developer account, a Developer ID certificate in the secrets above plus
          # these enables notarization (removes the "Open Anyway" step on other Macs):
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gittygit ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin
